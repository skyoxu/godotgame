name: Apply Knowledge Impact alignment once

on:
  push:
    branches:
      - feat/align-newrouge-knowledge-impact-health

permissions:
  contents: write

concurrency:
  group: apply-knowledge-impact-alignment-once
  cancel-in-progress: false

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/align-newrouge-knowledge-impact-health
          fetch-depth: 0

      - name: Fix CLI sync normalization
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path("scripts/python/sync_knowledge_impact_alignment.py")
          text = path.read_text(encoding="utf-8")
          old = '''def expected_dev_cli(text: str) -> str:
              text = _remove_marker_block(text, CLI_FUNCTION_BEGIN, CLI_FUNCTION_END)
              text = _remove_marker_block(text, CLI_PARSER_BEGIN.strip(), CLI_PARSER_END.strip())
              function_anchor = "\\ndef build_parser() -> argparse.ArgumentParser:\\n"
              if function_anchor not in text:
                  raise ValueError("dev_cli.py build_parser anchor not found")
              text = text.replace(function_anchor, "\\n" + CLI_FUNCTION_BLOCK + "\\n\\n\\ndef build_parser() -> argparse.ArgumentParser:\\n", 1)
              parser_anchor = "    # run-chapter7-ui-wiring\\n"
              if parser_anchor not in text:
                  raise ValueError("dev_cli.py Chapter 7 parser anchor not found")
              text = text.replace(parser_anchor, CLI_PARSER_BLOCK + "\\n\\n" + parser_anchor, 1)
              return text
          '''
          new = '''def expected_dev_cli(text: str) -> str:
              text = _remove_marker_block(text, CLI_FUNCTION_BEGIN, CLI_FUNCTION_END)
              text = _remove_marker_block(text, CLI_PARSER_BEGIN, CLI_PARSER_END)
              function_anchor = "def build_parser() -> argparse.ArgumentParser:\\n"
              index = text.find(function_anchor)
              if index < 0:
                  raise ValueError("dev_cli.py build_parser anchor not found")
              text = text[:index].rstrip() + "\\n\\n\\n" + CLI_FUNCTION_BLOCK + "\\n\\n\\n" + text[index:]
              parser_anchor = "    # run-chapter7-ui-wiring\\n"
              index = text.find(parser_anchor)
              if index < 0:
                  raise ValueError("dev_cli.py Chapter 7 parser anchor not found")
              text = text[:index].rstrip() + "\\n\\n" + CLI_PARSER_BLOCK + "\\n\\n" + text[index:]
              return text
          '''
          if old not in text:
              raise SystemExit("expected_dev_cli patch anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Apply and validate bounded alignment sync
        shell: pwsh
        run: |
          python scripts/python/sync_knowledge_impact_alignment.py --repo-root . --write
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/python/sync_knowledge_impact_alignment.py --repo-root . --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile scripts/python/dev_cli.py scripts/python/sync_knowledge_impact_alignment.py scripts/python/impact_analysis_index.py scripts/python/impact_runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit synchronized surfaces and remove one-shot workflow
        shell: pwsh
        run: |
          if (Test-Path .alignment-sync-diagnostic.txt) { Remove-Item .alignment-sync-diagnostic.txt }
          Remove-Item .github/workflows/apply-knowledge-impact-alignment-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow.md scripts/python/dev_cli.py scripts/python/project_health_knowledge.js scripts/python/sync_knowledge_impact_alignment.py .agents/skills .alignment-sync-diagnostic.txt .github/workflows/apply-knowledge-impact-alignment-once.yml
          git commit -m "chore: sync knowledge impact alignment surfaces"
          git push origin HEAD:feat/align-newrouge-knowledge-impact-health
