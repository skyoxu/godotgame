name: Windows Release (Manual)

on:
  workflow_dispatch:
    inputs:
      security_profile:
        description: Security profile for release validation
        type: choice
        options: [host-safe, strict]
        default: host-safe
  workflow_call:
    inputs:
      security_profile:
        type: string
        default: host-safe
      artifact_name:
        type: string
        default: windows-release
      export_size_max_mb:
        type: string
        default: '0'

# The tag caller grants write permission; ordinary manual exports only need read.
permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: '4.5.1'
      SECURITY_PROFILE: ${{ inputs.security_profile || 'host-safe' }}
      DELIVERY_PROFILE: fast-ship
      EXPORT_SIZE_MAX_MB: ${{ inputs.export_size_max_mb || '0' }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: ./.github/actions/setup-godot-windows
      - name: Validate selected profile
        shell: pwsh
        run: |
          if ($env:SECURITY_PROFILE -notin @('host-safe', 'strict')) { throw 'Invalid security profile.' }
          "DeliveryProfile: $env:DELIVERY_PROFILE`nSecurityProfile: $env:SECURITY_PROFILE" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Test the release commit
        shell: pwsh
        run: |
          py -3 scripts/python/run_dotnet.py --solution Game.sln --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build GodotGame.csproj -c ExportRelease -v minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build GodotGame.csproj -c Debug -v minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:GODOT_BIN" --headless --editor --path . --import
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache@v4
        with:
          path: godot/mono_export_templates.tpz
          key: templates-${{ runner.os }}-${{ env.GODOT_VERSION }}-mono-v1
      - name: Install .NET export templates
        shell: pwsh
        run: ./scripts/ci/install_export_templates.ps1 -Version "$env:GODOT_VERSION"
      - name: Export Windows release
        shell: pwsh
        run: ./scripts/ci/export_windows.ps1 -GodotBin "$env:GODOT_BIN" -Preset 'Windows Desktop' -Output build/Game.exe
      - name: Package complete Windows distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/* -DestinationPath dist/windows-game.zip -Force
          $packageRoot = Join-Path $env:RUNNER_TEMP 'godot-package-smoke'
          Expand-Archive dist/windows-game.zip -DestinationPath $packageRoot -Force
          ./scripts/ci/smoke_exe.ps1 -ExePath "$packageRoot/Game.exe" -TimeoutSec 15
      - name: Upload validated distribution
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name || 'windows-release' }}
          path: dist/windows-game.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: |
            logs/ci/**
            logs/unit/**
          if-no-files-found: ignore
          retention-days: 14
