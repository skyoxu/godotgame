name: Windows Release (Tag)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Never cancel a publication already in progress.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/windows-release.yml

  publish:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - name: Attach verified package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/windows-game.zip
          fail_on_unmatched_files: true
