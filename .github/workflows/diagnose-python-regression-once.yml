name: Diagnose Python regression once

on:
  push:
    branches:
      - feat/align-newrouge-knowledge-impact-health

permissions:
  contents: write

concurrency:
  group: diagnose-python-regression-once
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/align-newrouge-knowledge-impact-health
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run regression suite and capture verbose output
        shell: pwsh
        continue-on-error: true
        run: |
          python -m unittest discover -s scripts/ci/tests -p "test_*.py" -v *> .python-regression-diagnostic.txt
          $rc = $LASTEXITCODE
          "exit_code=$rc" | Add-Content .python-regression-diagnostic.txt
          Get-Content .python-regression-diagnostic.txt

      - name: Commit diagnostic and remove one-shot workflow
        if: always()
        shell: pwsh
        run: |
          Remove-Item .github/workflows/diagnose-python-regression-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .python-regression-diagnostic.txt .github/workflows/diagnose-python-regression-once.yml
          git commit -m "chore: record Python regression diagnostic"
          git push origin HEAD:feat/align-newrouge-knowledge-impact-health
