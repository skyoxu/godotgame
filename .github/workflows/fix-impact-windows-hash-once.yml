name: Fix Impact Windows hash once

on:
  push:
    branches:
      - feat/align-newrouge-knowledge-impact-health

permissions:
  contents: write

concurrency:
  group: fix-impact-windows-hash-once
  cancel-in-progress: false

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/align-newrouge-knowledge-impact-health
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Patch byte-stable Impact artifact write
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path("scripts/python/impact_analysis_index.py")
          text = path.read_text(encoding="utf-8")
          old = '''    raw = json.dumps(index, ensure_ascii=False, indent=2, sort_keys=True) + "\\n"
              index_path.write_text(raw, encoding="utf-8")
              manifest = {
                  "schema": MANIFEST_SCHEMA,
                  "index_id": index["index_id"],
                  "repository_revision": index["repository_revision"],
                  "artifact_path": index_path.relative_to(root).as_posix(),
                  "artifact_sha256": sha256_bytes(raw.encode("utf-8")),
          '''
          new = '''    raw = json.dumps(index, ensure_ascii=False, indent=2, sort_keys=True) + "\\n"
              raw_bytes = raw.encode("utf-8")
              index_path.write_bytes(raw_bytes)
              manifest = {
                  "schema": MANIFEST_SCHEMA,
                  "index_id": index["index_id"],
                  "repository_revision": index["repository_revision"],
                  "artifact_path": index_path.relative_to(root).as_posix(),
                  "artifact_sha256": sha256_bytes(raw_bytes),
          '''
          if old not in text:
              raise SystemExit("Impact publish patch anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify focused Impact regression
        shell: pwsh
        run: |
          python -m unittest scripts.ci.tests.test_impact_index_runtime -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit fix and remove one-shot workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/fix-impact-windows-hash-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/python/impact_analysis_index.py .github/workflows/fix-impact-windows-hash-once.yml
          git commit -m "fix: make impact index hash byte-stable on Windows"
          git push origin HEAD:feat/align-newrouge-knowledge-impact-health
