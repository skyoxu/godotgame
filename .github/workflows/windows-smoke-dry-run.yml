name: Windows Smoke (Dry Run)

# Notes:
# - Runs headless smoke and GdUnit tests only (no export/templates).
# - Requires [TEMPLATE_SMOKE_READY], a healthy exit, and no runtime errors.

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: '4.5.1'
      PYTHONIOENCODING: 'utf-8'
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve runtime scope
        id: scope
        shell: pwsh
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: py -3 scripts/python/ci_change_scope.py

      - name: Setup Godot Windows
        if: steps.scope.outputs.runtime == 'true'
        uses: ./.github/actions/setup-godot-windows

      - name: Prepare test project link
        if: steps.scope.outputs.runtime == 'true'
        shell: pwsh
        run: |
          ./scripts/ci/prepare_gd_tests.ps1 -ProjectPath 'Tests.Godot' -RuntimeDir 'Game.Godot'

      - name: Run GdUnit4 tests
        if: steps.scope.outputs.runtime == 'true'
        shell: pwsh
        run: |
          $env:Path = "$HOME\.dotnet;" + $env:Path
          py -3 scripts/python/run_gdunit.py --prewarm --godot-bin "$env:GODOT_BIN" --project Tests.Godot `
            --add tests/Scenes/Smoke `
            --timeout-sec 300 --rd "logs/e2e/${{ github.run_id }}/gdunit-reports/smoke-scenes"

      - name: Headless smoke (no export)
        if: steps.scope.outputs.runtime == 'true'
        shell: pwsh
        continue-on-error: true
        run: |
          ./scripts/ci/smoke_headless.ps1 -GodotBin "$env:GODOT_BIN" -TimeoutSec 15 -ProjectPath '.'

      - name: Upload smoke logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            logs/ci/**
            logs/e2e/**
          if-no-files-found: ignore
