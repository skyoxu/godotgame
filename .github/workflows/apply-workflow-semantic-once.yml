name: Apply Workflow Semantic Contract Once

on:
  push:
    branches:
      - feat/align-newrouge-knowledge-impact-health
    paths:
      - .github/workflows/apply-workflow-semantic-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/align-newrouge-knowledge-impact-health
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch workflow contract
        run: python scripts/python/patch_workflow_knowledge_impact.py --repo-root .
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git config user.name "skyoxu"
          git config user.email "skyoyou@hotmail.com"
          git rm .github/workflows/apply-workflow-semantic-once.yml
          git add workflow.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(workflow): apply semantic knowledge contract"
          git push origin HEAD:feat/align-newrouge-knowledge-impact-health
